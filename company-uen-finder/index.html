<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Company / UEN Finder V4</title>
  <link rel="icon" href="../assets/img/core-img/logo.png" type="image/png">


  <style>
    :root {
      --navy: #102a43;
      --blue: #1677ff;
      --blue2: #eaf3ff;
      --ink: #243b53;
      --muted: #6b7c93;
      --line: #d9e2ec;
      --bg: #f6f8fb;
      --ok: #0f8a5f;
      --danger: #c0392b;
      --card: #fff;
      --shadow: 0 10px 30px rgba(16, 42, 67, .08)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg)
    }

    .top {
      background: linear-gradient(120deg, #102a43, #174d7c);
      color: white;
      padding: 28px 24px 72px
    }

    .top-inner,
    .wrap {
      max-width: 1240px;
      margin: auto
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: #fff;
      color: #174d7c;
      display: grid;
      place-items: center;
      font-weight: 900
    }

    .brand h1 {
      font-size: 24px;
      margin: 0
    }

    .brand p {
      margin: 3px 0 0;
      color: #cfe4f8;
      font-size: 13px
    }

    .wrap {
      margin-top: -48px;
      padding: 0 20px 40px
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(217, 226, 236, .8);
      border-radius: 18px;
      box-shadow: var(--shadow)
    }

    .toolbar {
      padding: 18px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center
    }

    .toggle {
      display: inline-flex;
      background: #edf2f7;
      padding: 4px;
      border-radius: 12px
    }

    .toggle button {
      border: 0;
      background: transparent;
      padding: 10px 16px;
      border-radius: 9px;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer
    }

    .toggle button.active {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 2px 8px rgba(16, 42, 67, .12)
    }

    .searchbar {
      position: relative
    }

    .searchbar input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 42px 0 16px;
      font-size: 15px;
      outline: none
    }

    .searchbar input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, .12)
    }

    .clear {
      position: absolute;
      right: 10px;
      top: 9px;
      border: 0;
      background: #edf2f7;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      color: #52667a
    }

    .btn {
      height: 46px;
      border: 0;
      border-radius: 12px;
      padding: 0 17px;
      font-weight: 800;
      cursor: pointer
    }

    .btn-primary {
      background: var(--blue);
      color: white
    }

    .btn-secondary {
      background: #eef3f8;
      color: var(--ink)
    }

    .icon-actions {
      display: flex;
      gap: 8px
    }

    .icon-btn {
      width: 46px;
      padding: 0;
      display: inline-grid;
      place-items: center
    }

    .icon-btn svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .icon-btn-danger {
      color: var(--danger);
      background: #fff0ee
    }

    .icon-btn:focus-visible {
      outline: 3px solid rgba(22, 119, 255, .3);
      outline-offset: 2px
    }

    .file-note {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted)
    }

    .file-name {
      font-weight: 700;
      color: var(--ink)
    }

    .source-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      color: var(--muted);
      font-size: 13px
    }

    .source-row .toggle button {
      padding: 8px 12px
    }

    .drop {
      margin-top: 18px;
      padding: 38px 24px;
      text-align: center;
      border: 2px dashed #9fb3c8;
      border-radius: 18px;
      background: #fbfdff;
      cursor: pointer
    }

    .drop.drag {
      border-color: var(--blue);
      background: var(--blue2)
    }

    .drop .icon {
      font-size: 38px
    }

    .drop h2 {
      margin: 8px 0 6px
    }

    .drop p {
      margin: 0;
      color: var(--muted)
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #eef6ff;
      color: #174d7c
    }

    .status.error {
      background: #fff0ee;
      color: var(--danger)
    }

    .summary {
      display: none;
      margin: 18px 0 12px;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .metric {
      padding: 14px 16px
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px
    }

    .metric b {
      font-size: 20px;
      color: var(--navy)
    }

    .results {
      display: none;
      overflow: hidden
    }

    .results-head {
      padding: 15px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line)
    }

    .results-head h2 {
      font-size: 17px;
      margin: 0
    }

    .count {
      font-size: 13px;
      color: var(--muted)
    }

    .table-wrap {
      overflow: auto;
      max-height: 62vh
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px
    }

    th {
      position: sticky;
      top: 0;
      background: #edf3f8;
      color: #52667a;
      text-align: left;
      font-size: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      z-index: 1
    }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid #edf1f5;
      font-size: 13px;
      vertical-align: top
    }

    .company {
      font-weight: 750;
      color: var(--navy)
    }

    .uen {
      font-family: Consolas, monospace;
      font-weight: 700
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800
    }

    .registered {
      background: #e7f8f1;
      color: var(--ok)
    }

    .deregistered {
      background: #fff0ee;
      color: var(--danger)
    }

    .na {
      color: #9aa9b7
    }

    .pager {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px
    }

    .pager button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 9px;
      padding: 8px 12px;
      cursor: pointer
    }

    .pager button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .empty {
      padding: 42px;
      text-align: center;
      color: var(--muted)
    }

    @media(max-width:800px) {
      .toolbar {
        grid-template-columns: 1fr
      }

      .toggle {
        width: 100%
      }

      .toggle button {
        flex: 1
      }

      .summary {
        grid-template-columns: 1fr
      }

      .file-note {
        align-items: flex-start;
        flex-direction: column
      }

      .top {
        padding-bottom: 64px
      }
    }

    .controls {
      display: none;
      margin: 12px 0;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end
    }

    .control label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin: 0 0 6px
    }

    .control select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 0 10px
    }

    .history {
      display: none;
      margin: 0 0 14px;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .history strong {
      font-size: 12px;
      color: var(--muted)
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(16, 42, 67, .55);
      z-index: 20;
      padding: 22px;
      align-items: center;
      justify-content: center
    }

    .modal.open {
      display: flex
    }

    .modal-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .25);
      width: min(760px, 100%);
      max-height: 88vh;
      overflow: auto;
      padding: 22px
    }

    .modal-card h2 {
      margin: 0 0 6px
    }

    .modal-card p {
      color: var(--muted);
      margin: 0 0 18px
    }

    .mapping-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .mapping-grid label {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      display: block;
      margin-bottom: 5px
    }

    .mapping-grid select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 9px
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 20px
    }

    .required {
      color: var(--danger)
    }

    @media(max-width:800px) {

      .controls,
      .mapping-grid {
        grid-template-columns: 1fr
      }
    }

    /* Dataset loading progress */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(16, 42, 67, .65);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .loading-card {
      width: min(520px, 92vw);
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
      text-align: center
    }

    .loading-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 18px
    }

    .progress-bar {
      height: 18px;
      background: #e5edf6;
      border-radius: 999px;
      overflow: hidden
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--blue), #4ea1ff);
      transition: width .18s linear
    }

    .search-progress {
      width: min(320px, 100%);
      margin: 0 auto
    }

    .search-progress .progress-bar {
      height: 8px
    }

    .search-progress .progress-fill {
      width: 0;
      transition: width .2s ease
    }

    @media (prefers-reduced-motion: reduce) {
      .search-progress .progress-fill {
        transition: none
      }
    }

    .progress-text {
      margin-top: 10px;
      font-weight: 800;
      color: #174d7c
    }

    .loading-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      min-height: 18px
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="logo">UEN</div>
        <div>
          <h1>Company / UEN Finder</h1>
          <p>Live ACRA entity records from data.gov.sg</p>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="card toolbar" id="toolbar">
      <div class="toggle" aria-label="Search type"><button class="active" data-mode="uen">UEN</button><button
          data-mode="name">Company Name</button></div>
      <div class="searchbar"><input id="search" type="search" placeholder="Enter a UEN or company name"
          autocomplete="off"><button class="clear" id="clear" title="Clear search" aria-label="Clear search">×</button>
      </div>
      <div class="icon-actions" aria-label="Dataset actions">
        <button class="btn btn-primary" id="apiSearchBtn" type="button">Search</button>
      </div>
      <div class="file-note" style="grid-column:1/-1">
        <div><span>Data source: </span><span class="file-name" id="fileName">data.gov.sg · ACRA entities</span></div>
        <div id="loadedAt">Updated monthly by ACRA.</div>
      </div>
    </section>

    <section class="controls" id="controls">
      <div class="control"><label for="statusFilter">Registration status</label><select id="statusFilter">
          <option value="registered">Registered only</option>
          <option value="all" selected>All statuses</option>
          <option value="deregistered">Deregistered only</option>
        </select></div>
      <div class="control"><label for="typeFilter">Entity type</label><select id="typeFilter">
          <option value="all">All entity types</option>
        </select></div>
      <button class="btn btn-secondary" id="exportBtn">Export Results to CSV</button>
    </section>
    <section class="history" id="history"><strong>Recent searches</strong><span id="historyChips"></span><button
        class="chip" id="clearHistory">Clear</button></section>

    <div class="status" id="status"></div>

    <section class="card results" id="results">
      <div class="results-head">
        <h2>Search Results</h2>
        <div class="count" id="resultCount"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>UEN</th>
              <th>Company Name</th>
              <th>Status</th>
              <th>Entity Type</th>
              <th>Issue Date</th>
              <th>Registered Address</th>
              <th>Primary SSIC Code</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" hidden>No matching entities found.</div>
      </div>
      <div class="pager"><span id="pageText"></span><button id="prev">Previous</button><button id="next">Next</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
      const els = { apiSearchBtn: $('#apiSearchBtn'), status: $('#status'), search: $('#search'), clear: $('#clear'), fileName: $('#fileName'), loadedAt: $('#loadedAt'), tbody: $('#tbody'), empty: $('#empty'), resultCount: $('#resultCount'), pageText: $('#pageText'), prev: $('#prev'), next: $('#next'), statusFilter: $('#statusFilter'), typeFilter: $('#typeFilter'), exportBtn: $('#exportBtn'), history: $('#history'), historyChips: $('#historyChips'), clearHistory: $('#clearHistory') };
      const pageSize = 50;
      const ACRA_DATASET_ID = 'd_3f960c10fed6145404ca7b821f263b87';
      const ACRA_DETAIL_DATASETS = { A: 'd_8575e84912df3c28995b8e6e0e05205a', B: 'd_3a3807c023c61ddfba947dc069eb53f2', C: 'd_c0650f23e94c42e7a20921f4c5b75c24', D: 'd_acbc938ec77af18f94cecc4a7c9ec720', E: 'd_124a9bd407c7a25f8335b93b86e50fdd', F: 'd_4526d47d6714d3b052eed4a30b8b1ed6', G: 'd_b58303c68e9cf0d2ae93b73ffdbfbfa1', H: 'd_fa2ed456cf2b8597bb7e064b08fc3c7c', I: 'd_85518d970b8178975850457f60f1e738', J: 'd_478f45a9c541cbe679ca55d1cd2b970b', K: 'd_5573b0db0575db32190a2ad27919a7aa', L: 'd_a2141adf93ec2a3c2ec2837b78d6d46e', M: 'd_9af9317c646a1c881bb5591c91817cc6', N: 'd_67e99e6eabc4aad9b5d48663b579746a', O: 'd_5c4ef48b025fdfbc80056401f06e3df9', P: 'd_181005ca270b45408b4cdfc954980ca2', Q: 'd_4130f1d9d365d9f1633536e959f62bb7', R: 'd_2b8c54b2a490d2fa36b925289e5d9572', S: 'd_df7d2d661c0c11a7c367c9ee4bf896c1', T: 'd_72f37e5c5d192951ddc5513c2b134482', U: 'd_0cc5f52a1f298b916f317800251057f3', V: 'd_e97e8e7fc55b85a38babf66b0fa46b73', W: 'd_af2042c77ffaf0db5d75561ce9ef5688', X: 'd_1cd970d8351b42be4a308d628a6dd9d3', Y: 'd_31af23fdb79119ed185c256f03cb5773', Z: 'd_4e3db8955fdcda6f9944097bef3d2724', OTHERS: 'd_300ddc8da4e8f7bdc1bfc62d0d99e2e7' };
      const COMPANY_SUFFIXES = new Set(['the', 'pte', 'private', 'ltd', 'limited', 'company', 'co', 'inc', 'incorporated', 'corp', 'corporation', 'llc', 'plc', 'llp']);
      const BROAD_COMPANY_WORDS = new Set(['singapore', 'international', 'global', 'asia', 'asian', 'services', 'service', 'trading', 'holding', 'holdings', 'group', 'management', 'enterprise', 'enterprises', 'industries', 'industry', 'development', 'investment', 'investments', 'resources', 'resource', 'systems', 'solutions', 'technology', 'technologies', 'logistics', 'marketing', 'consultants', 'consulting', 'capital', 'ventures', 'partners', 'pacific', 'oriental']);
      let mode = 'uen', page = 1, currentPageSize = pageSize, apiRows = [], visibleRows = [], apiTotal = 0, apiRequest = null; const HISTORY_KEY = 'company-uen-history-v1';
      const primarySSICCache = new Map();
      let ssicRequest = null;
      try { indexedDB.deleteDatabase('company-uen-finder') } catch { }
      const norm = s => String(s ?? '').trim().toLowerCase().replace(/[\s_-]+/g, ' ');
      const clean = v => String(v ?? '').trim();
      const on = (el, event, handler) => { if (el) el.addEventListener(event, handler) };
      function hasInitialAmpersand(input) { return /(^|\s)\p{L}\s*&\s*\p{L}(?=\s|$)/u.test(input) }
      function nameSearchQuery(input) {
        const initialAmpersand = hasInitialAmpersand(input);
        const compactInitials = clean(input).replace(/(^|\s)(\p{L})\s*&\s*(\p{L})(?=\s|$)/gu, '$1$2$3');
        const words = compactInitials.replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim().split(' ');
        const usefulWords = words.filter(word => word && !COMPANY_SUFFIXES.has(word.toLowerCase()));
        const focusedWords = initialAmpersand ? usefulWords.filter(word => word.length > 2) : usefulWords;
        return (focusedWords.length ? focusedWords : usefulWords.length ? usefulWords : words).join(' ');
      }
      function nameSearchWord(words) {
        const specificWords = words.filter(word => word.length > 2 && !BROAD_COMPANY_WORDS.has(word.toLowerCase()));
        return (specificWords.length ? specificWords : words).reduce((best, word) => word.length > best.length ? word : best, '');
      }
      function normalizeCompanyName(input) { return clean(input).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').replace(/\s+/g, ' ').trim() }
      function detectSearchMode(input) {
        const compact = clean(input).replace(/[\s-]/g, '');
        if (!compact) return mode;
        if (/^\d+$/.test(compact) || /^\d{8,9}[a-z]$/i.test(compact) || /^t\d{2}(?:ll|lp)?\d{4}[a-z]?$/i.test(compact)) return 'uen';
        return 'name';
      }
      function setMode(nextMode) {
        mode = nextMode;
        $$('.toggle button[data-mode]').forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
        els.search.placeholder = mode === 'uen' ? 'Enter a UEN' : 'Enter a company name';
      }
      function setSearchProgress(percent, stage = '') {
        const progressBar = els.empty.querySelector('[role="progressbar"]');
        if (!progressBar) return;
        const progress = Math.max(0, Math.min(100, percent));
        progressBar.setAttribute('aria-valuenow', String(progress));
        progressBar.setAttribute('aria-valuetext', `${progress}% complete${stage ? `: ${stage}` : ''}`);
        progressBar.querySelector('.progress-fill').style.width = `${progress}%`;
        els.empty.querySelector('.progress-text').textContent = `${progress}%`;
      }
      async function loadPrimarySSIC(rows, onProgress = () => { }) {
        ssicRequest?.abort();
        const controller = new AbortController();
        ssicRequest = controller;
        const groups = new Map();
        for (const row of rows) {
          const uen = clean(row[0]).toUpperCase();
          if (primarySSICCache.has(uen)) continue;
          if (norm(row[7]) !== 'acra') { primarySSICCache.set(uen, ''); continue }
          const initial = normalizeCompanyName(row[1]).charAt(0).toUpperCase();
          const datasetId = ACRA_DETAIL_DATASETS[initial] || ACRA_DETAIL_DATASETS.OTHERS;
          if (!groups.has(datasetId)) groups.set(datasetId, []);
          groups.get(datasetId).push(row);
        }
        let failed = false;
        let completedGroups = 0;
        if (!groups.size) onProgress(1, 1);
        try {
          await Promise.all([...groups].map(async ([datasetId, groupedRows]) => {
            const expectedUens = new Set(groupedRows.map(row => clean(row[0]).toUpperCase()));
            const params = new URLSearchParams({ resource_id: datasetId, q: [...expectedUens].join(' '), limit: String(Math.max(100, expectedUens.size * 2)) });
            try {
              const response = await fetch(`https://data.gov.sg/api/action/datastore_search?${params}`, { signal: controller.signal });
              const payload = await response.json();
              if (!response.ok || !payload.success || !payload.result) throw new Error('The detailed ACRA response was invalid.');
              for (const record of payload.result.records) {
                const uen = clean(record.uen).toUpperCase();
                if (expectedUens.has(uen)) primarySSICCache.set(uen, norm(record.primary_ssic_code) === 'na' ? '' : clean(record.primary_ssic_code));
              }
              for (const uen of expectedUens) if (!primarySSICCache.has(uen)) primarySSICCache.set(uen, '');
            } catch (error) {
              if (error.name === 'AbortError') throw error;
              failed = true;
            } finally {
              if (ssicRequest === controller) onProgress(++completedGroups, groups.size);
            }
          }));
          for (const row of rows) row[6] = primarySSICCache.get(clean(row[0]).toUpperCase()) || '';
          return failed;
        } finally {
          if (ssicRequest === controller) ssicRequest = null;
        }
      }
      async function renderWithPrimarySSIC() {
        render();
        try {
          const failed = await loadPrimarySSIC([...visibleRows]);
          render();
          if (failed) showStatus('Some primary SSIC codes could not be retrieved.', true);
        } catch (error) {
          if (error.name !== 'AbortError') showStatus(error.message || 'Unable to retrieve primary SSIC codes.', true);
        }
      }
      function showStatus(msg, error = false) { els.status.textContent = msg; els.status.className = 'status' + (error ? ' error' : ''); els.status.style.display = 'block' }
      function hideStatus() { els.status.style.display = 'none' }
      function esc(v) { return clean(v).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c])) }
      async function searchDataGov(requestedPage = 1) {
        const enteredQuery = clean(els.search.value);
        const nameWords = mode === 'name' ? nameSearchQuery(enteredQuery).split(' ').filter(Boolean) : [];
        const query = mode === 'name' ? nameSearchWord(nameWords) : enteredQuery.replace(/[^a-z\d]/gi, '');
        if (query.length < 2) { showStatus('Enter at least 2 letters or numbers to search data.gov.sg.', true); return }
        apiRequest?.abort();
        ssicRequest?.abort();
        const controller = new AbortController();
        apiRequest = controller;
        currentPageSize = pageSize;
        page = requestedPage;
        apiRows = [];
        visibleRows = [];
        apiTotal = 0;
        els.empty.innerHTML = '<div class="search-progress"><div class="progress-bar" role="progressbar" aria-label="Loading search results" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill"></div></div><div class="progress-text">0%</div></div>';
        ssicRequest = null;
        render();
        setSearchProgress(0, 'Searching the ACRA dataset');
        const requestLimit = mode === 'name' ? 10000 : currentPageSize;
        const requestOffset = mode === 'name' ? 0 : (page - 1) * currentPageSize;
        hideStatus();
        try {
          const requestResults = async (searchTerm, limit, offset) => {
            const params = new URLSearchParams({ resource_id: ACRA_DATASET_ID, q: searchTerm, limit: String(limit), offset: String(offset) });
            const response = await fetch(`https://data.gov.sg/api/action/datastore_search?${params}`, { signal: controller.signal });
            const payload = await response.json();
            if (!response.ok) {
              const apiMessage = payload.error?.query?.join(' ') || payload.error?.message;
              throw new Error(apiMessage ? `data.gov.sg: ${apiMessage}` : `data.gov.sg returned HTTP ${response.status}.`);
            }
            if (!payload.success || !payload.result) throw new Error(payload.error?.message || 'The data.gov.sg response was invalid.');
            return payload.result;
          };
          let result = await requestResults(query, requestLimit, requestOffset);
          if (mode === 'name') {
            while (result.records.length < Number(result.total)) {
              const nextResult = await requestResults(query, requestLimit, result.records.length);
              if (!nextResult.records.length) throw new Error('The data.gov.sg response did not return all matching records.');
              result.records.push(...nextResult.records);
            }
          }
          apiRows = result.records.map(row => [row.uen, row.entity_name, row.uen_status_desc, row.entity_type_desc, row.uen_issue_date, row.reg_street_name, '', row.issuance_agency_desc]);
          if (mode === 'name') {
            apiRows = apiRows.filter(row => {
              const normalizedName = normalizeCompanyName(row[1]);
              return nameWords.every(word => normalizedName.includes(normalizeCompanyName(word)));
            });
          }
          const selectedType = els.typeFilter.value;
          const types = [...new Set(apiRows.map(row => row[3]).filter(type => type && norm(type) !== 'na'))].sort((a, b) => a.localeCompare(b));
          els.typeFilter.innerHTML = '<option value="all">All entity types</option>' + types.map(type => `<option value="${esc(type)}">${esc(type)}</option>`).join('');
          els.typeFilter.value = types.includes(selectedType) ? selectedType : 'all';
          if (mode === 'name') {
            const normalizedQuery = normalizeCompanyName(enteredQuery);
            const queryWords = normalizedQuery.split(' ').filter(Boolean);
            apiRows.sort((a, b) => {
              const score = name => {
                const normalizedName = normalizeCompanyName(name);
                if (normalizedName === normalizedQuery) return 0;
                if (normalizedName.startsWith(normalizedQuery)) return 1;
                if (queryWords.every(word => normalizedName.includes(word))) return 2;
                if (normalizedName.includes(normalizedQuery)) return 3;
                return 4;
              };
              return score(a[1]) - score(b[1]) || normalizeCompanyName(a[1]).localeCompare(normalizeCompanyName(b[1]));
            });
          }
          apiTotal = mode === 'name' ? apiRows.length : Number(result.total) || 0;
          visibleRows = getResultView().rows;
          els.empty.textContent = 'No matching entities found.';
          hideStatus();
          renderWithPrimarySSIC();
        } catch (error) {
          if (error.name !== 'AbortError') {
            els.empty.textContent = 'Search failed.';
            render();
            showStatus(error.message || 'Unable to reach data.gov.sg. Check your connection and try again.', true);
          }
        } finally {
          if (apiRequest === controller) apiRequest = null;
        }
      }
      function saveHistory() { const q = clean(els.search.value); if (q.length < 2) return; let h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); h = h.filter(x => !(x.q === q && x.mode === mode)); h.unshift({ q, mode }); localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, 8))); renderHistory() }
      function renderHistory() { const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); els.history.style.display = h.length ? 'flex' : 'none'; els.historyChips.innerHTML = h.map((x, i) => `<button class="chip" data-history="${i}">${esc(x.mode === 'uen' ? 'UEN: ' : 'Name: ')}${esc(x.q)}</button>`).join(''); els.historyChips.querySelectorAll('[data-history]').forEach(b => b.onclick = () => { const x = h[Number(b.dataset.history)]; setMode(x.mode); els.search.value = x.q; searchDataGov(1) }) }
      function csvCell(v) { const x = String(v ?? ''); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x }
      function exportCSV() { if (!visibleRows.length) { showStatus('There are no matching results to export.', true); return } const rows = [['UEN', 'Company Name', 'Status', 'Entity Type', 'Issue Date', 'Registered Address', 'Primary SSIC Code', 'Issuance Agency'], ...visibleRows.map(r => r.slice(0, 8))]; const blob = new Blob(['\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'company_uen_results_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000) }
      function value(v) { return !v || norm(v) === 'na' ? '<span class="na">na</span>' : esc(v) }
      function getResultView() {
        const filteredRows = apiRows.filter(row => (els.statusFilter.value === 'all' || norm(row[2]) === els.statusFilter.value) && (els.typeFilter.value === 'all' || row[3] === els.typeFilter.value));
        const pages = Math.max(1, Math.ceil((mode === 'name' ? filteredRows.length : apiTotal) / pageSize));
        page = Math.min(page, pages);
        const rows = mode === 'name' ? filteredRows.slice((page - 1) * pageSize, page * pageSize) : filteredRows;
        return { filteredRows, pages, rows };
      }
      function render() {
        const { filteredRows, pages, rows } = getResultView();
        visibleRows = rows;
        els.tbody.innerHTML = visibleRows.map(r => `<tr><td class="uen">${value(r[0])}</td><td class="company">${value(r[1])}</td><td><span class="badge ${norm(r[2]) === 'registered' ? 'registered' : 'deregistered'}">${value(r[2])}</span></td><td>${value(r[3])}</td><td>${value(r[4])}</td><td>${value(r[5])}</td><td>${value(r[6])}</td></tr>`).join('');
        els.empty.hidden = visibleRows.length > 0;
        els.resultCount.textContent = `${visibleRows.length} shown on page · ${(mode === 'name' ? filteredRows.length : apiTotal).toLocaleString()} API matches`;
        els.pageText.textContent = `Page ${page} of ${pages}`;
        els.prev.disabled = page <= 1;
        els.next.disabled = page >= pages;
      }
      on(els.search, 'change', saveHistory);
      on(els.search, 'input', () => setMode(detectSearchMode(els.search.value)));
      on(els.search, 'keydown', e => { if (e.key === 'Enter') { saveHistory(); searchDataGov(1) } });
      on(els.clear, 'click', () => { els.search.value = ''; apiRows = []; apiTotal = 0; page = 1; els.empty.textContent = 'No matching entities found.'; render(); hideStatus(); els.search.focus() });
      $$('.toggle button[data-mode]').forEach(b => on(b, 'click', () => { setMode(b.dataset.mode); els.search.focus() }));
      on(els.apiSearchBtn, 'click', () => searchDataGov(1));
      on(els.statusFilter, 'change', renderWithPrimarySSIC);
      on(els.typeFilter, 'change', renderWithPrimarySSIC);
      on(els.exportBtn, 'click', exportCSV);
      on(els.clearHistory, 'click', () => { localStorage.removeItem(HISTORY_KEY); renderHistory() });
      on(els.prev, 'click', () => { if (page > 1) searchDataGov(page - 1) });
      on(els.next, 'click', () => { if (page * currentPageSize < apiTotal) searchDataGov(page + 1) });
      $('#controls').style.display = 'grid';
      $('#results').style.display = 'block';
      renderHistory();
    })();
  </script>
