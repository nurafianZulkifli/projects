<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects</title>

    <link rel="icon" href="./assets/img/core-img/logo.png" type="image/png">

    <style>
        :root {
            color-scheme: dark;
            --black: #161a2c;
            --charcoal: #0f121f;
            --text: #f7f7f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--charcoal);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            min-height: 90px;
            padding: 20px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--black);
        }

        header a,
        header span {
            color: var(--text);
            font-size: clamp(24px, 3vw, 36px);
            font-weight: 700;
            text-decoration: none;
        }

        header a:hover,
        header a:focus-visible {
            text-decoration: underline;
        }

        main {
            width: 100%;
        }

        .shortcut {
            min-height: 166px;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            color: var(--text);
            text-align: center;
            text-decoration: none;
            font-size: clamp(34px, 5vw, 62px);
            font-weight: 700;
        }

        .shortcut:nth-child(odd) {
            background: #2f3758;
        }

        .shortcut:nth-child(even) {
            background: #1c2035;
        }

        .shortcut:hover,
        .shortcut:focus-visible {
            background: #555d80;
            transition: background 0.3s ease;
        }

        @media (max-width: 600px) {
            header {
                min-height: 72px;
                padding: 16px;
            }

            header a,
            header span {
                font-size: 22px;
            }

            .shortcut {
                min-height: 132px;
            }
        }
    </style>
</head>

<body>
    <header>
        <span>Projects</span>
    </header>
    <main>
        <a class="shortcut" href="uob-ocbc-checker/">UOB-OCBC Bank Branch Cheker</a>
        <a class="shortcut" href="company-uen-finder/">Company / UEN Finder</a>
        <a class="shortcut" href="union-ssic-checker/">Union-SSIC Checker</a>
    </main>
</body>

</html>
